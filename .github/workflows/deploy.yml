name: Deploy to GitHub Pages

on:
  # Se ejecuta automáticamente al hacer push a la rama principal (main)
  push:
    branches: [ main ]
  # Permite lanzar el despliegue manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos necesarios para leer el repositorio y publicar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

